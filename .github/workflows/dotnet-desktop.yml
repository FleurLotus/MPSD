name: Global Build

on:
  push:
  pull_request:

jobs:
  build_deploy_common:
    runs-on: windows-latest  # For a list of available runner types, refer to https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
        CommonSolution: '.\CommonLibraries\Common.sln'
        TestResult: '.\TestResults'

    # CheckOut of the code with just the head 
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # Install coverage tools if not already present
    - name: Install coverage tools if not already present
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        dotnet tool install --global dotnet-coverage

    #Restore dependencies
    - name: Restore
      run: dotnet restore $env:CommonSolution -v m
    
    #Build
    - name: Build
      run: dotnet build $env:CommonSolution -c Release --no-restore -v m

    #Run UnitTest and Coverage
    - name: Run UnitTests with coverage
      run: |
        $hasFailedTests = $false
        $frameworks = "net8.0", "net9.0"
        
        foreach ($framework in $frameworks)
        {
          Write-Host "Running Test for $framework ..."
          dotnet test .\CommonLibraries\netcore.slnf  --framework $framework --no-build -c Release -l "trx;LogFileName=$framework\test-results.trx" -v m --collect:"XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0)
          {
            $hasFailedTests = $true
          }
        }
        $frameworks = "net8.0-windows", "net9.0-windows"
        foreach ($framework in $frameworks)
        {
          Write-Host "Running Test for $framework ..."
          dotnet test .\CommonLibraries\netwindows.slnf  --framework $framework --no-build -c Release -l "trx;LogFileName=$framework\test-results.trx" -v m --collect:"XPlat Code Coverage"
          if ($LASTEXITCODE -ne 0)
          {
            $hasFailedTests = $true
          }
        }
        
        
        $frameworks = "net8.0-windows"
        foreach ($framework in $frameworks)
        {
          dotnet test .\CommonLibraries\netwindowsUI.slnf  --framework $framework --no-build -c Release -l "trx;LogFileName=$framework\test-results.trx" -v m --collect:"XPlat Code Coverage"
          
          $session = (New-Guid).Guid
          $coverageFile = "$frameworks\coverage.cobertura.xml"
          
          Write-Host "Starting dotnet-coverage server for session $session..."
          $serverJob = Start-Job -ScriptBlock { param($session_id, $output_file)
               & dotnet-coverage collect --server-mode --session-id $session_id --output-format cobertura --output $output_file
                                              } -ArgumentList $session, $coverageFile
          
          Start-Sleep -Seconds 5
          
          Write-Host "Running UI tests for $frameworks connected to coverage server..."
          & dotnet-coverage connect $session "dotnet" "test" ".\CommonLibraries\netwindowsUI.slnf" "--framework" "$framework" "--no-build" "-c" "Release" "-v" "m"
          
          Write-Host "Shutting down dotnet-coverage server..."
          & dotnet-coverage shutdown $session
          Remove-Job -Job $serverJob -Force
        }
        if ($hasFailedTests) 
        {
            exit 1
        }

    #Generate Coverage Report
    - name: Generate coverage report
      run: |
        # Find coverage files
        $coverageFiles = Get-ChildItem -Path "." -Filter "coverage.cobertura.xml" -Recurse
      
        if ($coverageFiles.Count -eq 0) 
        {
            Write-Warning "No coverage files found!"
            exit 1
        }
      
        # Generate HTML report
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"./CoverageReport" -reporttypes:"Html;Cobertura;JsonSummary"

    #Parse result
    - name: Parse and display coverage results
      run: |
        # Read the JSON summary for coverage percentage
        $summaryPath = "./CoverageReport/Summary.json"
        if (Test-Path $summaryPath) {
            $summary = Get-Content $summaryPath | ConvertFrom-Json
            $lineCoverage = [math]::Round($summary.summary.linecoverage, 2)
            $branchCoverage = [math]::Round($summary.summary.branchcoverage, 2)
          
            Write-Host "📊 Coverage Results:" -ForegroundColor Cyan
            Write-Host "  Line Coverage: $lineCoverage%" -ForegroundColor Yellow
            Write-Host "  Branch Coverage: $branchCoverage%" -ForegroundColor Yellow
          
            # Set output for other steps
            echo "LINE_COVERAGE=$lineCoverage" >> $env:GITHUB_ENV
            echo "BRANCH_COVERAGE=$branchCoverage" >> $env:GITHUB_ENV
          
            # Fail if coverage is below threshold
            $threshold = 80
            if ($lineCoverage -lt $threshold) 
            {
                Write-Host "❌ Line coverage ($lineCoverage%) is below threshold ($threshold%)" -ForegroundColor Red
            } else 
            {
                Write-Host "✅ Coverage meets threshold requirements!" -ForegroundColor Green
            }
        }

    # Upload Result
    - name: Upload artifact UnitTest Coverage
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: |
          ./**/*.trx
          ./CoverageReport/**/*

    # Publish Result
    - name: Publish test results to GitHub
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Unit Test Results
        path: './**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    # Publish code coverage to Codecov
    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    # Package Common
    - name: Package Common Release
      run: dotnet pack $env:CommonSolution -c Release -o .\LocalPackages -v m

    # Upload Result
    - name: Upload artifact LocalPackages
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: './LocalPackages/*.nupkg'


  build_mpsd:
    runs-on: windows-latest  # For a list of available runner types, refer to https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    needs: build_deploy_common
    env:
        MainSolution: '.\MagicPictureSetDownloader\MagicPictureSetDownloader.sln'

    # CheckOut of the code with just the head 
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # Get back the Package
    - name: Download artifact LocalPackages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: ./LocalPackages/

    # Restore Main
    - name: Restore
      run: dotnet restore $env:MainSolution --configfile .\nuget-local.config -v m

    # Build Main
    - name: Build Main Release
      run: dotnet build $env:MainSolution -c Release -v m --no-restore
